name: nsolid-bun

# NodeSource's build of Bun with the N|Solid agent: a Linux x64 release build,
# the N|Solid tests against it, and the stripped binary as an artifact. Bun's
# own pipeline runs on oven-sh's machines, so this one stands on its own.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
      - "nsolid/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"

jobs:
  linux-x64:
    name: Linux x64
    # GitHub's standard runner (4 cores, 16 GB) builds Bun slowly and is short
    # of disk; point NSOLID_BUN_LINUX_X64_RUNNER at a larger runner's label.
    runs-on: ${{ vars.NSOLID_BUN_LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install the pinned LLVM
        run: |
          sudo mkdir -p /opt/llvm && sudo chown "$USER" /opt/llvm
          bun scripts/nsolid/install-llvm.ts /opt/llvm
          echo /opt/llvm/bin >> "$GITHUB_PATH"

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build nasm

      - name: Check the agent's protocol tables
        run: bun packages/nsolid-protocol/generate.ts --check

      - name: Build
        env:
          # Set once nsolid-webkit-mirror.yml has copied the pinned WebKit release.
          NSOLID_WEBKIT_MIRROR: ${{ vars.NSOLID_WEBKIT_MIRROR }}
        run: bun run build:release ${NSOLID_WEBKIT_MIRROR:+--webkit-mirror=$NSOLID_WEBKIT_MIRROR}

      - name: Install test dependencies
        working-directory: test
        run: bun install --frozen-lockfile

      - name: N|Solid tests
        # The runner hands a crashing process to systemd-coredump, which holds
        # it for seconds while it reads a large binary's memory; the crash
        # tests' processes end at once, as on Bun's own CI machines.
        run: |
          echo core | sudo tee /proc/sys/kernel/core_pattern
          ulimit -c 0
          ./build/release/bun-profile test test/js/bun/nsolid/

      - name: Package
        run: |
          mkdir -p dist/nsolid-bun-linux-x64
          cp build/release/bun dist/nsolid-bun-linux-x64/nsolid-bun
          cd dist && tar -czf nsolid-bun-linux-x64.tar.gz nsolid-bun-linux-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nsolid-bun-linux-x64
          path: dist/nsolid-bun-linux-x64.tar.gz
          if-no-files-found: error

  # Bun's own tests of what the agent hooks into, run by Bun's test runner
  # (its retries, test/expectations.txt and test/flaky-tests.txt) against the
  # build above: with the agent off, as every process that doesn't ask for it
  # runs; and with it on and tracing, against a stub gateway.
  bun-tests:
    name: Bun tests, ${{ matrix.suite.name }}, agent ${{ matrix.agent }}
    needs: linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        agent: ["off", "on"]
        suite:
          - name: node:http
            include: js/node/http/,parallel/test-http-
          - name: node:net, dgram and dns
            include: js/node/net/,js/node/dgram/,js/node/dns/,parallel/test-net-,parallel/test-dgram-,parallel/test-dns-
          - name: node:fs
            include: js/node/fs/,parallel/test-fs-
          - name: Bun.serve and sockets
            include: js/bun/http/,js/bun/net/,js/bun/udp/,js/bun/dns/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version on Bun's CI machines (pins.nodejs in scripts/build/ci-images/spec.ts): some tests run Node and
      # expect what this one does.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nsolid-bun-linux-x64
          path: dist

      - name: Unpack
        run: |
          tar -xzf dist/nsolid-bun-linux-x64.tar.gz -C dist
          mkdir -p build/release
          mv dist/nsolid-bun-linux-x64/nsolid-bun build/release/bun

      - name: Start a stub gateway
        if: matrix.agent == 'on'
        run: |
          build/release/bun scripts/nsolid/stub-gateway.ts 47051 < /dev/null > stub-gateway.log 2>&1 &
          timeout 30 sh -c 'until [ -s stub-gateway.log ]; do sleep 0.2; done'
          cat stub-gateway.log
          {
            echo NSOLID_GRPC=127.0.0.1:47051
            echo NSOLID_GRPC_INSECURE=1
            echo NSOLID_APP=bun-tests
            echo NSOLID_TRACING_ENABLED=1
          } >> "$GITHUB_ENV"

      - name: Run
        env:
          # With the agent tracing, every request carries a traceparent, and these tests of Node's assert exactly
          # which headers a request has.
          LEFT_OUT: ${{ matrix.agent == 'on' && 'parallel/test-http-max-headers-count.js,parallel/test-http-mutable-headers.js,parallel/test-http-proxy-request-socket-keep-alive.mjs,parallel/test-http-proxy-request-invalid-char-in-url.mjs' || '' }}
        run: |
          echo core | sudo tee /proc/sys/kernel/core_pattern
          ulimit -c 0
          node scripts/runner.node.ts --exec-path build/release/bun --vendor=false --include "${{ matrix.suite.include }}" ${LEFT_OUT:+--exclude "$LEFT_OUT"}

  # What the agent costs the build above, against the overhead budget, in the
  # run's summary. Shared runners are noisy, so this reports and never fails
  # on the numbers.
  overhead:
    name: Agent overhead
    needs: linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nsolid-bun-linux-x64
          path: dist

      - name: Measure
        run: |
          tar -xzf dist/nsolid-bun-linux-x64.tar.gz -C dist
          bin=dist/nsolid-bun-linux-x64/nsolid-bun
          $bin scripts/nsolid/measure-overhead.ts $bin --json overhead.json --markdown "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nsolid-bun-overhead
          path: overhead.json
