syntax = "proto3";

import "common.proto";

package grpcagent;

// What runs the process: the runtime, its JavaScript engine and the agent's
// own build, as proposed with the N|Solid Console; N|Solid's own protos don't
// have it yet. An agent without it is N|Solid for Node.js.
message RuntimeInfo {
  string name = 1;           // "node" or "bun"
  string version = 2;        // the runtime's own version: 26.12.1 for Node.js, 1.4.6 for Bun
  string engine = 3;         // "v8" or "jsc"
  string agent_version = 4;  // the agent's build: 6.3.11 for N|Solid, 0.1.0 for nsolid-bun
}

// What the agent can do. An agent without it can do what N|Solid can.
message Capabilities {
  repeated string commands = 1;  // command names the agent answers
  repeated string settings = 2;  // ReconfigureBody keys the agent applies
}

message InfoBody {
  string app = 1;
  string arch = 2;
  uint32 cpuCores = 3;
  string cpuModel = 4;
  string execPath = 5;
  string hostname = 6;
  string id = 7;
  string main = 8;
  string nodeEnv = 9;
  uint32 pid = 10;
  string platform = 11;
  uint64 processStart = 12;
  repeated string tags = 13;
  uint64 totalMem = 14;
  map<string, string> versions = 15;
  uint32 kernelVersion = 16;
  optional string appVersion = 17;
  optional RuntimeInfo runtime = 18;
  optional Capabilities capabilities = 19;
}

message InfoEvent {
  CommonResponse common = 1;
  InfoBody body = 2;
}
